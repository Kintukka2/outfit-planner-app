name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine tests
        run: ./gradlew :engine:test

      - name: App tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest

      - name: Prepare signing key (optional)
        env:
          HANGER_KEYSTORE_BASE64: ${{ secrets.HANGER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HANGER_KEYSTORE_BASE64" ]; then
            echo "$HANGER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hanger.jks"
            echo "HANGER_KEYSTORE=$RUNNER_TEMP/hanger.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          HANGER_KEYSTORE_PASSWORD: ${{ secrets.HANGER_KEYSTORE_PASSWORD }}
          HANGER_KEY_PASSWORD: ${{ secrets.HANGER_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            engine/build/reports/tests
            app/build/reports/tests

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hanger-apk
          path: app/build/outputs/hanger/hanger.apk

      # Only builds signed with the personal key can update the installed app, so only those are published.
      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HANGER_KEYSTORE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Hanger (latest build)
          prerelease: false
          make_latest: true
          body: |
            Latest build of Hanger from `main` (${{ github.sha }}).
            Download **hanger.apk** on your Android phone and open it to install or update.
          files: app/build/outputs/hanger/hanger.apk
